---
# ─── IDEMPOTENCY CHECK ────────────────────────────────────────────────────────
# "Idempotent" means: safe to run multiple times — if k3s is already installed,
# skip the install steps. This is a core Ansible principle.

- name: Check if k3s binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary
  # "register" saves the task result into a variable called k3s_binary.
  # k3s_binary.stat.exists will be true/false.

# ─── INSTALL ──────────────────────────────────────────────────────────────────

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: "0755"
    force: false           # Don't re-download if already on disk
  when: not k3s_binary.stat.exists
  # "when" is a conditional — this task only runs if k3s is NOT installed yet.

- name: Install k3s
  ansible.builtin.command:
    cmd: /tmp/k3s_install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    # mode 644 makes the kubeconfig readable without sudo — needed by Helm later
    K3S_KUBECONFIG_MODE: "644"
  when: not k3s_binary.stat.exists
  notify: restart k3s
  # "notify" triggers a handler (restart k3s) at the end of the play,
  # but only if this task actually ran (changed state).

# ─── SERVICE ──────────────────────────────────────────────────────────────────

- name: Ensure k3s service is started and enabled on boot
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true
  # systemd module is idempotent: no-op if service is already running.

# ─── WAIT FOR CLUSTER READY ───────────────────────────────────────────────────

- name: Wait for k3s node to reach Ready state
  ansible.builtin.command:
    cmd: k3s kubectl get node
  register: node_status
  retries: 20         # Try up to 20 times
  delay: 10           # Wait 10 seconds between each retry
  until: "'Ready' in node_status.stdout"
  changed_when: false # This task never "changes" anything — it just checks

- name: Wait for kube-system pods to finish starting
  ansible.builtin.command:
    cmd: >
      k3s kubectl get pods -n kube-system
      --no-headers
      --field-selector=status.phase!=Succeeded
  register: pending_pods
  retries: 30
  delay: 10
  # Success: only Running pods remain (output has rows but none are Pending/Error)
  until: >
    pending_pods.stdout_lines | select('search', 'Pending|Init:|Error|CrashLoop') | list | length == 0
  changed_when: false
