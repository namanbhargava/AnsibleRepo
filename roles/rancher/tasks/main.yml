---
# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 1: HELM
# Helm is the "package manager" for Kubernetes — it installs apps (called
# "charts") into the cluster with a single command, handling all the k8s
# manifests for you.
# ═══════════════════════════════════════════════════════════════════════════════

- name: Check if the correct version of Helm is already installed
  ansible.builtin.command:
    cmd: helm version --short
  register: helm_installed_version
  failed_when: false   # Don't fail if helm doesn't exist yet (rc != 0 is OK)
  changed_when: false

- name: Download Helm archive
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/helm-{{ helm_version }}.tar.gz"
    mode: "0644"
    force: false
  when: helm_version not in (helm_installed_version.stdout | default(''))

- name: Extract Helm binary from archive
  ansible.builtin.unarchive:
    src: "/tmp/helm-{{ helm_version }}.tar.gz"
    dest: /tmp/
    remote_src: true          # The archive is on the remote machine, not local
    creates: /tmp/linux-amd64/helm   # Skip if already extracted
  when: helm_version not in (helm_installed_version.stdout | default(''))

- name: Copy Helm binary to {{ helm_install_dir }}
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: "{{ helm_install_dir }}/helm"
    mode: "0755"
    remote_src: true
  when: helm_version not in (helm_installed_version.stdout | default(''))

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 2: KUBECONFIG
# Helm and kubectl need to know which cluster to talk to. The kubeconfig file
# at /etc/rancher/k3s/k3s.yaml contains the cluster URL, credentials, etc.
# We pass it via environment variable so every subsequent task uses it.
# ═══════════════════════════════════════════════════════════════════════════════

- name: Set KUBECONFIG fact for use in all subsequent tasks
  ansible.builtin.set_fact:
    kubeconfig_env:
      KUBECONFIG: "{{ kubeconfig_path }}"
  # kubeconfig_env is now a dict we pass to "environment:" on every helm/kubectl task

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 3: CERT-MANAGER
# cert-manager is a Kubernetes add-on that automates TLS certificate lifecycle.
# Rancher requires it to manage the certificates it uses for HTTPS.
# ═══════════════════════════════════════════════════════════════════════════════

- name: Add Jetstack Helm repository (cert-manager source)
  ansible.builtin.command:
    cmd: helm repo add jetstack https://charts.jetstack.io
  environment: "{{ kubeconfig_env }}"
  register: repo_add_jetstack
  changed_when: "'already exists' not in repo_add_jetstack.stdout"
  failed_when: >
    repo_add_jetstack.rc != 0 and
    'already exists' not in repo_add_jetstack.stderr

- name: Update Helm repository cache
  ansible.builtin.command:
    cmd: helm repo update
  environment: "{{ kubeconfig_env }}"
  changed_when: false

- name: Apply cert-manager CRDs (CustomResourceDefinitions)
  ansible.builtin.command:
    cmd: >
      k3s kubectl apply -f
      https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.crds.yaml
  environment: "{{ kubeconfig_env }}"
  register: crds_result
  changed_when: "'configured' in crds_result.stdout or 'created' in crds_result.stdout"
  # CRDs extend the Kubernetes API — they define new resource types like
  # "Certificate" and "ClusterIssuer". We apply them separately from the Helm
  # chart to avoid issues when upgrading (Helm doesn't handle CRD upgrades well).

- name: Create cert-manager namespace
  ansible.builtin.command:
    cmd: k3s kubectl create namespace {{ cert_manager_namespace }}
  environment: "{{ kubeconfig_env }}"
  register: ns_cert
  failed_when: ns_cert.rc != 0 and 'already exists' not in ns_cert.stderr
  changed_when: ns_cert.rc == 0

- name: Install cert-manager via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install cert-manager jetstack/cert-manager
      --namespace {{ cert_manager_namespace }}
      --version {{ cert_manager_version }}
      --set installCRDs=false
      --wait
      --timeout 5m0s
  environment: "{{ kubeconfig_env }}"
  register: cert_manager_install
  changed_when: "'STATUS: deployed' in cert_manager_install.stdout"
  # "upgrade --install": installs if not present, upgrades if already installed.
  # "--wait": blocks until all pods are Running before the task completes.

- name: Wait for cert-manager deployment to be ready
  ansible.builtin.command:
    cmd: >
      k3s kubectl rollout status deployment/cert-manager
      -n {{ cert_manager_namespace }}
      --timeout=300s
  environment: "{{ kubeconfig_env }}"
  changed_when: false

- name: Wait for cert-manager webhook to be ready
  ansible.builtin.command:
    cmd: >
      k3s kubectl rollout status deployment/cert-manager-webhook
      -n {{ cert_manager_namespace }}
      --timeout=300s
  environment: "{{ kubeconfig_env }}"
  changed_when: false
  # The webhook must be fully up before Rancher installs, because Rancher
  # creates Certificate resources and the webhook validates them.

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 4: RANCHER
# Rancher is a Kubernetes management platform. We install it via Helm into the
# "cattle-system" namespace. It uses Traefik (k3s's built-in ingress) to expose
# its UI, and cert-manager to handle its HTTPS certificate.
# ═══════════════════════════════════════════════════════════════════════════════

- name: Add Rancher stable Helm repository
  ansible.builtin.command:
    cmd: helm repo add rancher-stable {{ rancher_chart_repo }}
  environment: "{{ kubeconfig_env }}"
  register: repo_add_rancher
  changed_when: "'already exists' not in repo_add_rancher.stdout"
  failed_when: >
    repo_add_rancher.rc != 0 and
    'already exists' not in repo_add_rancher.stderr

- name: Update Helm repository cache (after adding Rancher repo)
  ansible.builtin.command:
    cmd: helm repo update
  environment: "{{ kubeconfig_env }}"
  changed_when: false

- name: Create cattle-system namespace
  ansible.builtin.command:
    cmd: k3s kubectl create namespace {{ rancher_namespace }}
  environment: "{{ kubeconfig_env }}"
  register: ns_cattle
  failed_when: ns_cattle.rc != 0 and 'already exists' not in ns_cattle.stderr
  changed_when: ns_cattle.rc == 0

- name: Install Rancher via Helm
  ansible.builtin.command:
    cmd: >
      helm upgrade --install rancher rancher-stable/rancher
      --namespace {{ rancher_namespace }}
      --version {{ rancher_version }}
      --set hostname={{ rancher_hostname }}
      --set bootstrapPassword={{ rancher_bootstrap_password }}
      --set tls={{ rancher_tls_source }}
      --set ingress.ingressClassName={{ rancher_ingress_class }}
      --wait
      --timeout 10m0s
  environment: "{{ kubeconfig_env }}"
  register: rancher_install
  changed_when: "'STATUS: deployed' in rancher_install.stdout"
  no_log: true
  # tls=external → Rancher creates an HTTP ingress only; TLS is handled by NLB/ACM.
  # tls=rancher  → Rancher generates its own self-signed cert (for direct access).

- name: Wait for Rancher deployment to fully roll out
  ansible.builtin.command:
    cmd: >
      k3s kubectl rollout status deployment/rancher
      -n {{ rancher_namespace }}
      --timeout=600s
  environment: "{{ kubeconfig_env }}"
  changed_when: false

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 5: MULTI-SAN TLS CERTIFICATE
#
# Problem: Rancher's auto-generated cert covers only the sslip.io hostname.
# When accessed via SSM tunnel (localhost:8443), the browser sees a hostname
# mismatch and silently blocks WebSocket connections (used for log streaming).
#
# Fix: Replace the Rancher TLS secret with a self-signed cert that includes
# BOTH the sslip.io hostname AND localhost as Subject Alternative Names (SANs).
# This way the cert is valid regardless of how you access Rancher.
#
# The cert is generated with openssl on the remote machine so no local tools
# are needed. The CA cert is printed at the end so you can import it into
# your browser once and trust all future certs from this CA.
# ═══════════════════════════════════════════════════════════════════════════════

- name: Create directory for TLS cert generation
  ansible.builtin.file:
    path: /tmp/rancher-tls
    state: directory
    mode: "0700"

- name: Generate CA private key
  ansible.builtin.command:
    cmd: openssl genrsa -out /tmp/rancher-tls/ca.key 4096
    creates: /tmp/rancher-tls/ca.key

- name: Generate self-signed CA certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -new -nodes
      -key /tmp/rancher-tls/ca.key
      -sha256 -days 3650
      -out /tmp/rancher-tls/ca.crt
      -subj "/CN=Rancher-Local-CA/O=Local"
    creates: /tmp/rancher-tls/ca.crt

- name: Generate Rancher TLS private key
  ansible.builtin.command:
    cmd: openssl genrsa -out /tmp/rancher-tls/tls.key 2048
    creates: /tmp/rancher-tls/tls.key

- name: Write OpenSSL SAN config (covers both sslip.io hostname and localhost)
  ansible.builtin.copy:
    dest: /tmp/rancher-tls/san.cnf
    mode: "0600"
    content: |
      [req]
      req_extensions = v3_req
      distinguished_name = req_distinguished_name
      [req_distinguished_name]
      [v3_req]
      subjectAltName = @alt_names
      [alt_names]
      DNS.1 = {{ rancher_hostname }}
      DNS.2 = localhost
      IP.1  = 127.0.0.1
      IP.2  = {{ ansible_default_ipv4.address }}

- name: Generate Certificate Signing Request (CSR)
  ansible.builtin.command:
    cmd: >
      openssl req -new
      -key /tmp/rancher-tls/tls.key
      -out /tmp/rancher-tls/tls.csr
      -subj "/CN={{ rancher_hostname }}/O=Local"
      -config /tmp/rancher-tls/san.cnf
    creates: /tmp/rancher-tls/tls.csr

- name: Sign the CSR with our CA to produce the TLS certificate
  ansible.builtin.command:
    cmd: >
      openssl x509 -req
      -in /tmp/rancher-tls/tls.csr
      -CA /tmp/rancher-tls/ca.crt
      -CAkey /tmp/rancher-tls/ca.key
      -CAcreateserial
      -out /tmp/rancher-tls/tls.crt
      -days 3650
      -sha256
      -extfile /tmp/rancher-tls/san.cnf
      -extensions v3_req
    creates: /tmp/rancher-tls/tls.crt

- name: Replace tls-rancher-ingress secret with the multi-SAN certificate
  ansible.builtin.command:
    cmd: >
      k3s kubectl create secret tls tls-rancher-ingress
      --cert=/tmp/rancher-tls/tls.crt
      --key=/tmp/rancher-tls/tls.key
      --namespace {{ rancher_namespace }}
      --dry-run=client -o yaml
  environment: "{{ kubeconfig_env }}"
  register: tls_secret_yaml
  changed_when: false
  # "--dry-run=client -o yaml" generates the secret manifest without applying it.
  # We pipe it to kubectl apply in the next task so the operation is idempotent
  # (apply updates an existing secret; create would fail if it already exists).

- name: Apply the TLS secret (create or update)
  ansible.builtin.shell:
    cmd: >
      echo '{{ tls_secret_yaml.stdout }}' |
      k3s kubectl apply -f -
  environment: "{{ kubeconfig_env }}"
  register: tls_apply
  changed_when: "'configured' in tls_apply.stdout or 'created' in tls_apply.stdout"

- name: Restart Rancher pods to pick up new certificate
  ansible.builtin.command:
    cmd: >
      k3s kubectl rollout restart deployment/rancher
      -n {{ rancher_namespace }}
  environment: "{{ kubeconfig_env }}"
  changed_when: true

- name: Wait for Rancher to come back up after cert rotation
  ansible.builtin.command:
    cmd: >
      k3s kubectl rollout status deployment/rancher
      -n {{ rancher_namespace }}
      --timeout=300s
  environment: "{{ kubeconfig_env }}"
  changed_when: false

- name: Read CA certificate for browser import
  ansible.builtin.slurp:
    src: /tmp/rancher-tls/ca.crt
  register: ca_cert_content

- name: Save CA certificate locally for browser import
  ansible.builtin.copy:
    content: "{{ ca_cert_content.content | b64decode }}"
    dest: "./rancher-ca.crt"
    mode: "0644"
  delegate_to: localhost
  # "delegate_to: localhost" runs this task on YOUR machine (the Ansible control node),
  # not on the remote machine. This saves the CA cert locally so you can import it
  # into your browser once — then all Rancher HTTPS and WebSocket connections will
  # be trusted automatically.

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 6: VERIFICATION
# ═══════════════════════════════════════════════════════════════════════════════

- name: Wait for Rancher HTTPS endpoint to become available
  ansible.builtin.uri:
    url: "https://{{ rancher_hostname }}/ping"
    validate_certs: false     # Rancher's cert is self-signed — skip CA validation
    status_code: 200
    timeout: 30
  register: rancher_ping
  retries: 20
  delay: 15
  until: rancher_ping.status == 200
  # /ping is Rancher's built-in health endpoint — returns "pong" when fully up.

- name: Print Rancher access information
  ansible.builtin.debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "  Rancher is ready!"
      - "  Direct URL : https://{{ rancher_hostname }}"
      - "  SSM tunnel : https://localhost:<tunnel_port>"
      - "  Username   : admin"
      - "  Password   : <your rancher_bootstrap_password from vault.yml>"
      - ""
      - "  A CA certificate has been saved to: ./rancher-ca.crt"
      - "  Import it into your browser to trust Rancher's HTTPS and"
      - "  WebSocket connections without warnings."
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
