# Group name: k3s_nodes
# Every machine listed here gets its own independent k3s cluster + Rancher.
# Add one line per machine. The "ansible_host" is the IP Ansible SSHes into.
#
# Format:
#   <alias>  ansible_host=<ip>
#
# Example — replace with your real machine IPs:
[k3s_nodes]
node1  ansible_host=192.168.1.10
# node2  ansible_host=192.168.1.20   ← uncomment and add more machines as needed
