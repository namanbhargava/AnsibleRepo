---
# ─── k3s ──────────────────────────────────────────────────────────────────────
k3s_version: "v1.29.4+k3s1"
k3s_config_dir: "/etc/rancher/k3s"
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

# ─── Helm ─────────────────────────────────────────────────────────────────────
helm_version: "v3.15.1"
helm_install_dir: "/usr/local/bin"

# ─── cert-manager (required by Rancher for TLS certificate management) ────────
cert_manager_version: "v1.14.5"
cert_manager_namespace: "cert-manager"

# ─── Rancher ──────────────────────────────────────────────────────────────────
rancher_version: "2.8.4"
rancher_namespace: "cattle-system"
rancher_chart_repo: "https://releases.rancher.com/server-charts/stable"
rancher_ingress_class: "traefik"

# Rancher gets its OWN subdomain to avoid path conflicts with other apps.
# Rancher internally uses /api, /v1, /v3 — sharing a hostname with apps
# that also use /api would cause Traefik to mis-route Rancher's own API calls.
rancher_hostname: "rancher.test.dev.aws.myapp.net"

# "external" = TLS terminated by NLB (ACM cert). Rancher creates HTTP ingress.
# "rancher"  = Rancher manages its own self-signed cert (for direct/SSM access).
rancher_tls_source: "external"

# ─── App hostname (path-based routing for all non-Rancher apps) ───────────────
# backend-app, frontend-app, and Grafana share this hostname with path routing.
# Rancher is NOT on this hostname — it is on rancher_hostname above.
# ACM cert must cover BOTH rancher_hostname and app_hostname.
# A wildcard cert (*.test.dev.aws.myapp.net) covers both with one cert.
app_hostname: "test.dev.aws.myapp.net"
