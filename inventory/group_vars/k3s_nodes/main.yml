---
# ─── k3s ──────────────────────────────────────────────────────────────────────
k3s_version: "v1.29.4+k3s1"
k3s_config_dir: "/etc/rancher/k3s"
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

# ─── Helm ─────────────────────────────────────────────────────────────────────
helm_version: "v3.15.1"
helm_install_dir: "/usr/local/bin"

# ─── cert-manager (required by Rancher for TLS certificate management) ────────
cert_manager_version: "v1.14.5"
cert_manager_namespace: "cert-manager"

# ─── Rancher ──────────────────────────────────────────────────────────────────
rancher_version: "2.8.4"
rancher_namespace: "cattle-system"
rancher_chart_repo: "https://releases.rancher.com/server-charts/stable"

# k3s ships with Traefik as its built-in ingress controller.
# This tells Rancher's Ingress to use it.
rancher_ingress_class: "traefik"

# sslip.io is a public DNS service: <ip>.sslip.io resolves to <ip>.
# ansible_default_ipv4.address is automatically detected by Ansible from the machine.
# So if the machine IP is 10.0.0.5, the hostname becomes: 10.0.0.5.sslip.io
rancher_hostname: "{{ ansible_default_ipv4.address }}.sslip.io"

# ─── SSM / Tunnel access ───────────────────────────────────────────────────────
# When accessing Rancher via SSM tunnel or port-forward (e.g. localhost:8443),
# the browser cannot reach the private sslip.io hostname directly for WebSocket
# connections (log streaming, shell, etc.).
#
# Set rancher_server_url to the URL your BROWSER uses to reach Rancher.
# The cattle-cluster-agent will always use the internal Kubernetes service URL
# regardless of this setting.
#
# Examples:
#   Direct access (default): "https://{{ rancher_hostname }}"
#   SSM tunnel on port 8443: "https://localhost:8443"
rancher_server_url: "https://{{ rancher_hostname }}"

# Internal Kubernetes service URL used by cattle-cluster-agent.
# This stays constant regardless of how you access Rancher externally.
rancher_internal_url: "https://rancher.cattle-system.svc.cluster.local"
