---
# ─── k3s ──────────────────────────────────────────────────────────────────────
k3s_version: "v1.29.4+k3s1"
k3s_config_dir: "/etc/rancher/k3s"
kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

# ─── Helm ─────────────────────────────────────────────────────────────────────
helm_version: "v3.15.1"
helm_install_dir: "/usr/local/bin"

# ─── cert-manager (required by Rancher for TLS certificate management) ────────
cert_manager_version: "v1.14.5"
cert_manager_namespace: "cert-manager"

# ─── Rancher ──────────────────────────────────────────────────────────────────
rancher_version: "2.8.4"
rancher_namespace: "cattle-system"
rancher_chart_repo: "https://releases.rancher.com/server-charts/stable"
rancher_ingress_class: "traefik"

# The public hostname users type in their browser.
# With NLB + ACM this is your internal DNS name.
# With sslip.io fallback it is the machine IP.
rancher_hostname: "test.dev.aws.myapp.net"

# "external" = TLS is terminated by the NLB (ACM cert). Rancher configures
# an HTTP ingress and does not manage its own TLS certificate.
# Change to "rancher" to let Rancher manage its own self-signed cert (e.g. for
# direct sslip.io access without NLB).
rancher_tls_source: "external"

# ─── Shared ingress hostname (same for all apps) ───────────────────────────────
# All path-based ingress rules use this hostname so Traefik routes correctly.
app_hostname: "test.dev.aws.myapp.net"
