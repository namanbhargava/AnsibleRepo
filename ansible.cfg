[defaults]
# Where to find the list of machines to manage
inventory          = inventory/hosts.ini

# Default SSH user (override per-host with ansible_user in inventory)
remote_user        = root

# Don't fail if the SSH host key is not in known_hosts (useful for fresh machines)
host_key_checking  = False

# Don't create .retry files on playbook failure
retry_files_enabled = False

# Makes output easier to read (YAML-style instead of one long line)
stdout_callback    = yaml

# Automatically detect the Python interpreter on the remote machine
interpreter_python = auto_silent

[privilege_escalation]
# Use sudo to run tasks as root (no-op when remote_user is already root)
become        = True
become_method = sudo
